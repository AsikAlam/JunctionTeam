<script>
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const loginSection = document.getElementById("loginSection");
    const signupStep1 = document.getElementById("signupStep1");
    const signupStep2 = document.getElementById("signupStep2");
    const msgBox = document.getElementById("msgBox");

    let pendingSignup = null;
    let activeOtp = "";

    function showMessage(text, type) {
      msgBox.textContent = text;
      msgBox.className = "msg-box " + (type === "success" ? "msg-success" : "msg-error");
      msgBox.style.display = "block";
    }

    function hideMessage() {
      msgBox.style.display = "none";
    }

    function getStoredAccounts() {
      const defaults = [{ username: "admin", phone: "0000000000", password: "1234", verified: true }];
      const saved = JSON.parse(localStorage.getItem("jt_accounts") || "[]");
      return [...defaults, ...saved];
    }

    function renderUatList() {
      const listEl = document.getElementById("uatAccountList");
      const accounts = getStoredAccounts();
      listEl.innerHTML = accounts
        .map((a) => `• ${a.username} | ${a.phone} | pass: ${a.password}`)
        .join("<br>");
    }

    // UAT Drawer Controls
    document.getElementById("toggleUatBtn").addEventListener("click", () => {
      renderUatList();
      document.getElementById("uatPanel").classList.toggle("open");
    });

    document.getElementById("quickAdminBtn").addEventListener("click", () => {
      tabLogin.click();
      document.getElementById("loginId").value = "admin";
      document.getElementById("loginPass").value = "1234";
      showMessage("Filled default UAT admin credentials.", "success");
    });

    document.getElementById("clearUatBtn").addEventListener("click", () => {
      localStorage.removeItem("jt_accounts");
      renderUatList();
      showMessage("All custom UAT test accounts cleared.", "success");
    });

    // Tab switching
    tabLogin.addEventListener("click", () => {
      tabLogin.classList.add("active");
      tabSignup.classList.remove("active");
      loginSection.classList.remove("hidden-form");
      signupStep1.classList.add("hidden-form");
      signupStep2.classList.add("hidden-form");
      hideMessage();
    });

    tabSignup.addEventListener("click", () => {
      tabSignup.classList.add("active");
      tabLogin.classList.remove("active");
      signupStep1.classList.remove("hidden-form");
      signupStep2.classList.add("hidden-form");
      loginSection.classList.add("hidden-form");
      hideMessage();
    });

    // Show/hide password
    document.querySelectorAll(".toggle-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        const hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        btn.textContent = hidden ? "HIDE" : "SHOW";
      });
    });

    // OTP Logic
    function issueOtp() {
      activeOtp = Math.floor(100000 + Math.random() * 900000).toString();
      document.getElementById("generatedOtpText").textContent = activeOtp;
      const inputs = document.querySelectorAll(".otp-digit");
      inputs.forEach((inp) => (inp.value = ""));
      inputs[0].focus();
    }

    const otpInputs = document.querySelectorAll(".otp-digit");
    otpInputs.forEach((input, idx) => {
      input.addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, "");
        if (e.target.value && idx < otpInputs.length - 1) otpInputs[idx + 1].focus();
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !e.target.value && idx > 0) otpInputs[idx - 1].focus();
      });
      input.addEventListener("paste", (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "").slice(0, 6);
        pasted.split("").forEach((char, i) => {
          if (otpInputs[i]) otpInputs[i].value = char;
        });
        if (pasted.length > 0) otpInputs[Math.min(pasted.length, 5)].focus();
      });
    });

    // Sign Up Step 1
    document.getElementById("signupDetailsForm").addEventListener("submit", (e) => {
      e.preventDefault();
      hideMessage();

      const username = document.getElementById("signupUser").value.trim();
      const code = document.getElementById("countryCode").value;
      const phone = document.getElementById("signupPhone").value.trim();
      const password = document.getElementById("signupPass").value;

      const existing = getStoredAccounts().find(
        (a) => a.username.toLowerCase() === username.toLowerCase() || a.phone === phone
      );
      if (existing) {
        showMessage("Username or mobile number already registered in UAT.", "error");
        return;
      }

      pendingSignup = { username, phone, fullPhone: `${code} ${phone}`, password, verified: true };
      document.getElementById("displayPhone").textContent = pendingSignup.fullPhone;

      signupStep1.classList.add("hidden-form");
      signupStep2.classList.remove("hidden-form");
      issueOtp();
    });

    // Sign Up Step 2: Verify OTP
    document.getElementById("otpVerifyForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const enteredOtp = Array.from(otpInputs).map((i) => i.value).join("");

      if (enteredOtp !== activeOtp) {
        showMessage("Invalid OTP. Check the UAT Test OTP banner above.", "error");
        return;
      }

      const saved = JSON.parse(localStorage.getItem("jt_accounts") || "[]");
      saved.push(pendingSignup);
      localStorage.setItem("jt_accounts", JSON.stringify(saved));

      localStorage.setItem("jt_session", JSON.stringify({
        username: pendingSignup.username,
        phone: pendingSignup.phone,
        loginTime: new Date().toISOString()
      }));

      showMessage("Account verified! Redirecting to dashboard...", "success");
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 600);
    });

    document.getElementById("resendOtpBtn").addEventListener("click", () => {
      issueOtp();
      showMessage("New UAT OTP generated.", "success");
    });

    document.getElementById("editPhoneBtn").addEventListener("click", () => {
      signupStep2.classList.add("hidden-form");
      signupStep1.classList.remove("hidden-form");
      hideMessage();
    });

    // Sign In Handler
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      hideMessage();

      const loginId = document.getElementById("loginId").value.trim();
      const loginPass = document.getElementById("loginPass").value;

      const accounts = getStoredAccounts();
      const matched = accounts.find(
        (a) =>
          (a.username.toLowerCase() === loginId.toLowerCase() || a.phone === loginId) &&
          a.password === loginPass
      );

      if (!matched) {
        showMessage("Invalid credentials. Try admin / 1234 or sign up.", "error");
        return;
      }

      localStorage.setItem("jt_session", JSON.stringify({
        username: matched.username,
        phone: matched.phone,
        loginTime: new Date().toISOString()
      }));

      showMessage("Login successful! Redirecting...", "success");
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 400);
    });
  </script>
</body>
</html>
