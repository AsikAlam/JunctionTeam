<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JunctionTeam — Secret HQ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Ambient Background Blobs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.45;
      animation: floatOrb 12s infinite alternate ease-in-out;
      pointer-events: none;
    }
    .orb-1 { width: 380px; height: 380px; background: #2563eb; top: -80px; left: -80px; }
    .orb-2 { width: 340px; height: 340px; background: #9333ea; bottom: -60px; right: -60px; animation-delay: -4s; }
    .orb-3 { width: 260px; height: 260px; background: #06b6d4; top: 45%; left: 45%; animation-delay: -8s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, -40px) scale(1.18); }
    }

    /* Confetti Canvas */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    /* Header & Top Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 28px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    .logo {
      font-weight: 800;
      font-size: 20px;
      background: linear-gradient(90deg, #38bdf8, #a855f7, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      cursor: pointer;
    }

    .rocket-icon {
      display: inline-block;
      -webkit-text-fill-color: initial;
      animation: bounceRocket 1.6s infinite ease-in-out;
    }

    @keyframes bounceRocket {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(8deg); }
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #cbd5e1;
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      color: #ffffff;
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(148, 163, 184, 0.25);
    }

    .nav-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.35), rgba(139, 92, 246, 0.35));
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-pill {
      border: none;
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    .btn-pill:hover { transform: translateY(-2px); }

    .btn-party {
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      color: #fff;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.35);
    }

    .logout-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    .logout-btn:hover {
      background: #ef4444;
      color: #fff;
    }

    .menu-toggle-btn {
      display: none;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 960px) {
      header {
        flex-wrap: wrap;
        padding: 14px 18px;
      }

      .menu-toggle-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .top-nav {
        display: none;
        width: 100%;
        order: 4;
        padding-top: 10px;
        border-top: 1px solid rgba(148, 163, 184, 0.15);
      }

      .top-nav.open {
        display: flex;
      }
    }

    /* Main Container */
    main {
      position: relative;
      z-index: 10;
      max-width: 1040px;
      margin: 36px auto;
      padding: 0 24px;
    }

    /* Hero Card */
    .hero-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 20px;
      padding: 32px 36px;
      margin-bottom: 26px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 15.5px;
      line-height: 1.6;
      max-width: 720px;
    }

    /* Section Panes */
    .section-pane {
      display: none;
    }

    .section-pane.active {
      display: block;
    }

    .section-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 21px;
      font-weight: 800;
      color: #f8fafc;
    }

    .back-hq-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #e2e8f0;
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .back-hq-btn:hover {
      border-color: #38bdf8;
      color: #fff;
    }

    /* Interactive Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 22px;
    }

    .card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(56, 189, 248, 0.5);
    }

    .card-emoji {
      font-size: 34px;
      margin-bottom: 12px;
      display: inline-block;
      transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    .card:hover .card-emoji {
      transform: scale(1.2) rotate(10deg);
    }

    .card h2 {
      font-size: 18.5px;
      margin-bottom: 8px;
      color: #f1f5f9;
    }

    .card p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .meta-tag {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 700;
      color: #7dd3fc;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 12px;
      width: fit-content;
    }

    .action-btn {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      transition: transform 0.15s, filter 0.2s;
    }

    .action-btn:hover { filter: brightness(1.1); }
    .action-btn:active { transform: scale(0.97); }

    .btn-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .btn-danger { background: linear-gradient(135deg, #f43f5e, #e11d48); }
    .btn-emerald { background: linear-gradient(135deg, #10b981, #059669); }

    /* Hilarious Animations Classes */
    .disco-mode {
      animation: discoBg 0.5s infinite linear !important;
    }

    @keyframes discoBg {
      0% { filter: hue-rotate(0deg); }
