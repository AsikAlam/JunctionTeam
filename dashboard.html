<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 32px; background: #1e293b; border-bottom: 1px solid #334155;
    }
    .logo { font-weight: 700; font-size: 18px; color: #38bdf8; }
    .logout-btn {
      background: #ef4444; color: white; border: none; padding: 8px 16px;
      border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    main { max-width: 960px; margin: 48px auto; padding: 0 24px; }
    .welcome-box {
      background: #1e293b; border: 1px solid #334155; border-radius: 14px;
      padding: 32px; margin-bottom: 24px;
    }
    h1 { font-size: 26px; margin-bottom: 8px; }
    p { color: #94a3b8; line-height: 1.6; }
  </style>
</head>
<body>

  <script>
    // Redirect back to login page if not signed in
    if (sessionStorage.getItem("isLoggedIn") !== "true") {
      window.location.href = "index.html";
    }
  </script>

  <header>
    <div class="logo">My Workspace</div>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </header>

  <main>
    <div class="welcome-box">
      <h1>Welcome inside, <span id="userDisplay">Admin</span>!</h1>
      <p>Your login flow is active. This inner workspace is ready for whatever interactive tools, dashboards, or pages you want to build next.</p>
    </div>
  </main>

  <script>
    document.getElementById("userDisplay").textContent = sessionStorage.getItem("loggedUser") || "Admin";
    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.clear();
      window.location.href = "index.html";
    });
  </script>

</body>
</html>
